<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QueryCraft - Sign Up</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: white; }
  header { padding: 20px 40px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
  header h1 { color: #38bdf8; }
  nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: bold; }
  .form-box { max-width: 400px; margin: 60px auto; background: #1e293b; padding: 30px; border-radius: 10px; }
  .form-box h2 { margin-top: 0; }
  input { width: 100%; padding: 12px; margin: 8px 0 16px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
  .btn { width: 100%; background: #38bdf8; color: #0f172a; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
  #msg { margin-top: 15px; font-weight: bold; }
  a.link { color: #38bdf8; }
</style>
</head>
<body>

<header>
  <h1>QueryCraft</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="questions.html">Practice</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="form-box">
  <h2>Create Account</h2>
  <label>Name</label>
  <input type="text" id="name" placeholder="Your name">
  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="Choose a password">
  <button class="btn" onclick="signup()">Sign Up</button>
  <div id="msg"></div>
  <p>Already have an account? <a class="link" href="login.html">Login</a></p>
</div>

<script>
async function signup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');

  if (!name || !email || !password) {
    msg.style.color = '#ef4444';
    msg.innerText = 'Please fill all fields';
    return;
  }

  try {
    const res = await fetch('http://127.0.0.1:8000/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    if (!res.ok) {
      msg.style.color = '#ef4444';
      msg.innerText = 'Signup failed. This email may already be registered.';
      return;
    }

    const data = await res.json();
    localStorage.setItem('user_id', data.user_id);
    localStorage.setItem('user_name', name);
    localStorage.setItem('show_welcome', '1');

    msg.style.color = '#22c55e';
    msg.innerText = 'Account created! Taking you to practice...';
    setTimeout(() => window.location.href = 'questions.html', 1000);
  } catch (err) {
    msg.style.color = '#ef4444';
    msg.innerText = 'Something went wrong. Is the server running?';
  }
}
</script>

</body>
</html>
