<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QueryCraft - Practice</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<style>
  .container { padding: 40px; }
  .filters select { padding: 8px; margin-right: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--card); }
  tr:hover { background: var(--hover); cursor: pointer; }
  .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
  .Easy { background: #166534; }
  .Medium { background: #854d0e; }
  .Hard { background: #7f1d1d; }
</style>
</head>
<body>

<header>
  <h1>QueryCraft</h1>
  <nav id="nav"></nav>
</header>

<div class="container">
  <h2>Practice Questions</h2>
  <div class="filters">
    <select id="topicFilter"><option value="">All Topics</option></select>
    <select id="difficultyFilter">
      <option value="">All Difficulty</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>
  </div>

  <table>
    <thead><tr><th>Title</th><th>Topic</th><th>Difficulty</th></tr></thead>
    <tbody id="questionsList"></tbody>
  </table>
</div>

<script>
fetch('http://127.0.0.1:8000/questions')
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('questionsList');
    data.forEach(q => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${q.title}</td><td>${q.topic}</td><td><span class="badge ${q.difficulty}">${q.difficulty}</span></td>`;
      row.onclick = () => window.location.href = `editor.html?id=${q.id}`;
      list.appendChild(row);
    });
  });
</script>

</body>
</html>
